name: 🧪 Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test ${{matrix.platform.runner}} ${{matrix.platform.arch}} Godot ${{matrix.godot-version}}
    runs-on: ${{matrix.platform.runner}}
    strategy:
      fail-fast: false
      matrix:
        godot-version:
          - 4.5.1-stable
          - 4.6.3-stable
          - 4.7.1-stable
        platform:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: windows-latest
            arch: x86_64
          - runner: macos-15
            arch: universal

        # Remaining architectures run on the baseline engine only.
        include:
          - godot-version: 4.5.1-stable
            platform:
              runner: windows-latest
              arch: x86_32
          - godot-version: 4.5.1-stable
            platform:
              runner: windows-11-arm
              arch: arm64
          - godot-version: 4.5.1-stable
            platform:
              runner: ubuntu-latest
              arch: x86_32
          - godot-version: 4.5.1-stable
            platform:
              runner: ubuntu-22.04-arm
              arch: arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: false # don't initialize submodules automatically

      - name: Prepare testing
        uses: ./.github/actions/prepare-testing
        with:
          arch: ${{ matrix.platform.arch }}
          godot-version: ${{ matrix.godot-version }}

      - name: Run tests
        shell: bash
        timeout-minutes: 5
        run: |
          # Exit status codes: 0 - success, 100 - failures, 101 - warnings, 104 - tests not found, 105 - didn't run.
          ${GODOT} --headless --path project/ -- run-tests "res://test/suites/"

      - name: Run isolated tests
        if: success() || failure()
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/run-isolated-tests.ps1

      - name: Run JSONAssert tests
        if: success() || failure()
        shell: bash
        timeout-minutes: 2
        run: |
          ${GODOT} --headless --debug --path project/ \
              --script "res://addons/gdUnit4/bin/GdUnitCmdTool.gd" \
              --ignoreHeadlessMode \
              --continue \
              --add test/util/json_assert/

# getsentry/sentry-godot 394180fb7c3aede585da211596f4e9e9291e9615

rubric = "sdk"

# GDExtension (C++) compiled by SConstruct into the addon's native libraries; backend chosen per export platform.
[[area]]
paths = ["src/**", "SConstruct", "site_scons/**"]
families = ["game-engine", "mobile-native", "native"]

# Platform-independent part of the extension that every backend builds on.
[[area]]
paths = [
  "src/sentry/*", "src/sentry/util/**", "src/sentry/processing/**", "src/sentry/integrations/**",
  "src/sentry/logging/**", "src/sentry/auto_metrics/**", "src/sentry/engine_lifecycle/**",
  "src/sentry/platform/**", "src/register_types.cpp", "src/manifest.gdextension",
]
families = ["game-engine", "mobile-native", "native", "browser"]
shared_core = true

# Web export: JavaScript bridge bundling the Sentry browser SDK.
[[area]]
paths = ["src/sentry/javascript/**"]
families = ["game-engine", "browser"]

# Android plugin (Kotlin) bridging to sentry-android.
[[area]]
paths = ["android_lib/**"]
families = ["game-engine", "mobile-native"]

# Editor plugin and export plugins (run in the Godot editor on the developer's machine, patch the customer's
# .csproj and inject Gradle/Xcode settings into exports), plus Roslyn analyzers and source generators.
[[area]]
paths = [
  "src/editor/**", "src/sentry/dotnet/managed/Sentry.Godot.Analyzers/**",
  "src/sentry/dotnet/managed/Sentry.Godot.SourceGenerators/**",
]
families = ["tooling", "game-engine"]

# Addon files shipped as-is (GDScript user feedback UI, .NET auto-init and props imported into customer projects).
[[area]]
paths = ["project/addons/sentry/**"]
families = ["game-engine"]

# Class reference compiled into the extension (GodotCPPDocData) and the generated record of every exposed class,
# method and property (scripts/update-doc-classes.ps1).
[[area]]
paths = ["doc_classes/**"]
families = ["game-engine"]

# godot-cpp is the engine binding the whole extension is compiled against; .gitmodules lists it.
[[area]]
paths = ["modules/godot-cpp", ".gitmodules"]
families = ["game-engine", "mobile-native", "native", "browser"]
shared_core = true

# Bundled native SDKs (sentry-native submodule, sentry-cocoa download) and the Android library's Gradle pins.
[[area]]
paths = [
  "modules/sentry-native", "modules/sentry-native.SConscript", "modules/sentry-cocoa.*",
  "gradle/libs.versions.toml", "gradle/wrapper/**",
]
families = ["game-engine", "mobile-native", "native"]

# wasm-split, downloaded at this version by SConstruct, splits debug info out of the web build.
[[area]]
paths = ["modules/wasm-split.properties"]
families = ["game-engine", "browser"]

# Shared MSBuild properties that point every C# project at the shipped Sentry.Godot.Versions.props.
[[area]]
paths = ["Directory.Build.props"]
families = ["tooling", "game-engine"]

# Roslyn release-tracking files are compiler inputs (AdditionalFiles) recording shipped diagnostic IDs,
# so they must not be left as docs-only.
[[kind]]
paths = ["doc_classes/*.xml", "**/AnalyzerReleases.*.md"]
kind = "public-api-record"

# Bundled SDKs: sentry-native and godot-cpp are submodules; sentry-cocoa and wasm-split (symbolicator) are
# downloaded at the versions in modules/*.properties; sentry-android is pinned in android_lib/build.gradle.kts
# and again in the Android export plugin; Sentry .NET in Sentry.Godot.Versions.props; @sentry/browser in the
# bridge package.json. Test-only submodules (gdUnit4, doctest, app-runner, json_assert) are included.
[[kind]]
paths = [
  "modules/**", "project/test/util/json_assert", "project/test/util/json_assert/**",
  "android_lib/build.gradle.kts", "src/editor/sentry_editor_export_plugin_android.cpp",
  "project/addons/sentry/dotnet/Sentry.Godot.Versions.props", "gradle/wrapper/gradle-wrapper.properties",
]
kind = "dependencies"

[[kind]]
paths = [
  "SConstruct", "site_scons/**", "modules/*.SConscript", "src/manifest.gdextension", "**/*.props",
  "**/*.targets", "**/*.slnx", "**/*.sln", "**/*.csproj", "**/*.gradle.kts", "gradle.properties", "gradle/**",
  "gradlew", "gradlew.bat", "scripts/**", "assetlib/**", "fastlane/**", "exports/**", ".ruby-version",
  "src/sentry/javascript/bridge/*.config.js", "src/sentry/javascript/bridge/tsconfig.json",
]
kind = "build-release"

[[kind]]
paths = ["tests/**", "project/test/**", "android_lib/src/test/**"]
kind = "tests"

# The demo project is packaged as a separate demo zip, never into a customer's game.
[[kind]]
paths = [
  "project/*", "project/views/**", "project/cli/**",
]
kind = "samples"

[[kind]]
paths = [".clang-format", "agents.toml"]
kind = "dev-tooling"
